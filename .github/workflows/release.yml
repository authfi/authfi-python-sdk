# Publishes the package to PyPI when a version tag (vX.Y.Z) is pushed. PyPI trusts this workflow by
# OpenID Connect (trusted publishing): there is no API token anywhere, and every file carries a
# provenance attestation (PEP 740). The trusted publisher on pypi.org names this repository, this file
# and the `pypi` environment, so a copy of the workflow elsewhere cannot publish. The `pypi` environment
# needs a reviewer's approval before the publish job starts.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  UV_LOCKED: "1"

jobs:
  # Built and tested without the publishing permission, so nothing the build runs can obtain a PyPI credential.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # A tag on the wrong commit must fail here: a version on PyPI can never be replaced.
      - name: The tag is a version on main, with a changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a version tag (vMAJOR.MINOR.PATCH)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          v="${TAG#v}"
          grep -Eq "^## \[?${v//./\\.}\]?( |$)" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }
      - uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d # v7.1.0
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest -m "not live"
      - run: uv build --sdist --wheel --out-dir dist
      - run: uvx twine@7.0.0 check --strict dist/*
      # The release tag is the version: v1.2.3 publishes 1.2.3 and nothing else.
      - name: The built version is the tag's
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#v}"
          ls dist
          for f in dist/*; do
            case "$(basename "$f")" in
              authfi-"$want".tar.gz|authfi-"$want"-*.whl) ;;
              *) echo "::error::$f is not version $want (tag $TAG)"; exit 1 ;;
            esac
          done
      - name: The wheel installs and imports in a clean environment
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          cd / && /tmp/clean/bin/python -c "import authfi; from authfi._version import __version__; print(__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/authfi/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
