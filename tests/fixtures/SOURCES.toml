# Every fixture names what it encodes: where it was observed, the platform code that produces it,
# and the commit read. tests/unit/test_fixtures.py fails for a fixture without an entry, so a
# fixture cannot drift from the platform without someone saying which platform.

["platform-beta/openid-configuration.json"]
observed = "GET https://platform-beta.authfi.io/.well-known/openid-configuration, 2026-10-20 (byte-identical to oauth-authorization-server)"
file = "the authorization-server metadata the identity service serves"
commit = "identity service 2026-10-20; kernel library v0.58.0"

["platform-beta/jwks.json"]
observed = "GET https://platform-beta.authfi.io/.well-known/jwks.json, 2026-10-20"
file = "the key service, its public key set"
