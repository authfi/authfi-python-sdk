[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "authfi"
dynamic = ["version"]
description = "AuthFI SDK: sign people in, protect APIs, machine clients and AI agents on one OAuth core"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AuthFI" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "PyJWT[crypto]>=2.10,<3",
    "cryptography>=44",
    "typing_extensions>=4.12",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.scripts]
authfi = "authfi.cli:main"

[project.optional-dependencies]
fastapi = ["fastapi>=0.115,<1"]
flask = ["flask>=3.0,<4"]
# mcp stays below 2: its 2.x needs an httpx2 client factory where these adapters pass an httpx one (the OpenAI Agents
# SDK refuses it outright), and langchain-mcp-adapters 0.3 itself requires mcp<2. litellm 1.106 imports a type only
# mcp 2 has, so litellm stays below it while mcp does.
# A framework extra covers the framework's major version, so a pip resolve is not held back for a minor release; where
# an adapter reaches into the framework (no public seam), it checks that seam when it is imported and raises
# IntegrationError naming the version it is tested with. The adapters job installs each extra at its lowest and its
# newest version. LangSmith is never required: tracing redaction applies only when it is installed.
langchain = ["langchain-core>=1.0,<2"]
# The ready-made Claude model. Its private seam is pinned to the tested minor.
langchain-anthropic = ["authfi[langchain]", "langchain-anthropic>=1.7,<1.8"]
langgraph = [
    "authfi[langchain]",
    "langgraph>=1.2,<2",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "mcp>=1.30,<2",
]
# Auth for a graph deployed on LangSmith Deployment (authfi.langgraph_auth): the deployment already has langgraph-sdk.
langgraph-auth = ["langgraph-sdk>=0.2,<1"]
openai-agents = ["openai-agents[litellm]>=0.24,<0.25", "litellm>=1.83,!=1.92.*,<1.106", "mcp>=1.30,<2"]
claude-agent = ["claude-agent-sdk>=0.2.168,<0.3", "mcp>=1.30,<2"]
# Steps to AuthFI over OTLP/HTTP (authfi.otel); the SDK and the exporter are the OpenTelemetry project's.
otel = ["opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2"]
# mcp 2 drops the gateway's governance annotation from tools/list (its ToolAnnotations keeps no extras), so the
# adapters stay on mcp 1 until the platform sends governance where mcp 2 keeps it.
pydantic-ai = ["pydantic-ai-slim[anthropic,mcp]>=2.60,<2.64", "mcp>=1.30,<2"]
crewai = ["crewai[anthropic]>=1.15,<1.16", "mcp>=1.30,<2"]
# llama-index-llms-anthropic builds its messages from anthropic 1.x types, which anthropic 2 turned into unions.
llama-index = [
    "anthropic>=0.75,<2",
    "llama-index-core>=0.14,<0.15",
    "llama-index-llms-anthropic>=0.12,<0.13",
    "llama-index-tools-mcp>=0.4.6,<0.5",
    "mcp>=1.30,<2",
]
# litellm 1.92 releases import orjson without requiring it: the range excludes them.
adk = ["google-adk>=2.12,<3", "litellm>=1.83,!=1.92.*,<1.106", "mcp>=1.30,<2"]

[project.urls]
Homepage = "https://authfi.io"
Documentation = "https://authfi.io/docs"
Source = "https://github.com/authfi/authfi-python-sdk"
Changelog = "https://github.com/authfi/authfi-python-sdk/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/authfi/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/authfi"]

[tool.hatch.build.targets.sdist]
include = ["src/authfi", "tests", "conformance", "scripts", "docs", "CHANGELOG.md", "README.md", "LICENSE", "NOTICE"]

[dependency-groups]
# What the adapters job installs beside one extra, at that extra's lowest and newest versions.
test = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "hypothesis>=6.120,<7",
    "sentry-sdk>=2.20,<3",
    "rich>=13.9,<15",
]
# The weekly mutation run (Linux only): a surviving mutant is a missing test.
mutation = ["mutmut==3.8.0"]
dev = [
    { include-group = "test" },
    "pytest-cov>=6,<8",
    "mypy>=1.15,<2",
    # the [nodejs] extra ships Node in the wheel, so pyright does not download it at run time
    "pyright[nodejs]>=1.1.390,<2",
    "ruff>=0.9,<1",
    "fastapi>=0.115,<1",
    "flask>=3.0,<4",
    "anthropic>=1.0,<2",
    "openai>=3.0,<4",
    "langchain-core>=1.0,<2",
    "langchain-anthropic>=1.7,<1.8",
    "langsmith>=0.14,<1",
    "langgraph>=1.2,<2",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "mcp>=1.30,<2",
    "openai-agents[litellm]>=0.24,<0.25",
    "claude-agent-sdk>=0.2.168,<0.3",
    "google-adk>=2.12,<3",
    "pydantic-ai-slim[anthropic,mcp]>=2.60,<2.64",
    "llama-index-core>=0.14,<0.15",
    "llama-index-llms-anthropic>=0.12,<0.13",
    "llama-index-tools-mcp>=0.4.6,<0.5",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[tool.uv]
# CrewAI pins anthropic 0.73 and openai 2, which the other framework extras (and the dev group) cannot share,
# so it is installed on its own: `uv sync --extra crewai --no-group dev`.
conflicts = [
    [{ extra = "crewai" }, { group = "dev" }],
    [{ extra = "crewai" }, { extra = "langchain" }],
    [{ extra = "crewai" }, { extra = "langchain-anthropic" }],
    [{ extra = "crewai" }, { extra = "langgraph" }],
    [{ extra = "crewai" }, { extra = "openai-agents" }],
    [{ extra = "crewai" }, { extra = "claude-agent" }],
    [{ extra = "crewai" }, { extra = "adk" }],
    [{ extra = "crewai" }, { extra = "pydantic-ai" }],
    [{ extra = "crewai" }, { extra = "llama-index" }],
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = ["live: runs against a real AuthFI project; needs AUTHFI_LIVE_* settings"]
filterwarnings = [
    "error::authfi.errors.AuthFIDeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # openai-agents 0.24 opens MCP sessions with the client mcp renamed
    "ignore:Use `streamable_http_client` instead:DeprecationWarning",
    # The fork-safety tests fork on purpose, after the adapter tests' local servers have started threads
    "ignore:This process .* is multi-threaded, use of fork:DeprecationWarning",
    # google-adk 2.12 announces its own experimental features and renames on every use
    'ignore:\[EXPERIMENTAL\] feature:UserWarning',
    "ignore:MCPTool class is deprecated:DeprecationWarning",
]

[tool.mutmut]
# Every module is copied so the package imports; the weekly job selects which mutants run.
source_paths = ["src/authfi/"]
pytest_add_cli_args_test_selection = ["tests/unit/"]

[tool.coverage.run]
branch = true
source = ["authfi"]
# CrewAI cannot be installed beside the dev group (see [tool.uv] conflicts): the crewai job measures it.
omit = ["src/authfi/crewai.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/authfi", "tests", "scripts", "examples"]
# CrewAI cannot be installed beside the type checkers (see [tool.uv] conflicts): the crewai job checks these.
exclude = ["src/authfi/crewai[.]py", "tests/unit/test_crewai[.]py"]
# Lets the numpy override below apply to numpy's stub files too.
follow_imports_for_stubs = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["tests.compat.*"]
warn_unreachable = false

[[tool.mypy.overrides]]
module = ["opentelemetry", "opentelemetry.*", "llama_index.tools.mcp", "llama_index.tools.mcp.*"]
ignore_missing_imports = true

# LlamaIndex re-exports its instrumentation API without __all__ and ships its MCP package untyped.
[[tool.mypy.overrides]]
module = ["authfi.llama_index"]
disallow_subclassing_any = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["llama_index.core.instrumentation", "llama_index.core.instrumentation.*"]
implicit_reexport = true

# numpy (a LlamaIndex dependency) ships stubs in Python 3.12 syntax, which mypy rejects when checking for 3.11.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "deprecated", "deprecated.*"]
follow_imports = "skip"

[tool.pyright]
include = ["src/authfi", "tests", "scripts", "examples"]
exclude = ["**/crewai.py", "**/test_crewai.py"]
# Lets the numpy override below apply to numpy's stub files too.
follow_imports_for_stubs = true
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingModuleSource = false
executionEnvironments = [
    { root = "tests", extraPaths = ["."], reportPrivateUsage = false },
    { root = "src" },
    { root = "scripts" },
    # Framework signatures carry unparameterised generics (LangGraph's Command), which strict mode
    # reports on every call an example makes; the examples' own code is still checked in full.
    { root = "examples", reportUnknownMemberType = false },
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "S", "D", "ANN", "ASYNC", "PT", "RUF", "TID", "I"]
ignore = [
    "D105",   # magic methods document themselves
    "D107",   # the class docstring documents construction
    "ANN401", # Any is used where a JSON value really is any JSON value
    "D401",   # docstrings name what a function returns, as the standard library's do
    "S105",   # "token" names a domain concept here, not a password; secrets are held in Secret
    "S106",
    "S107",
    "ASYNC109", # the async clients take timeout= as the blocking ones do: one signature for both
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "ANN", "PT011", "PT018"]
"tests/compat/test_main_*.py" = ["PT009", "PT027"]  # main's unittest style, kept as written
"scripts/**" = ["S603", "S607"]
"examples/**" = ["T201", "INP001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.pydocstyle]
convention = "pep257"
